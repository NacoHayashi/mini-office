<div id="lobby"><h1>🎮 小遊戲大廳</h1><p class="sub">今天想玩哪一款？</p><a class="card" href="#zip"><div class="ic" style="background:linear-gradient(135deg,#ff9a3c,#ff5f6d)"><svg viewBox="0 0 100 100" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M22 25H78V50H22V75H78"/></svg></div><div class="tx"><b>Zip</b><span>一筆畫連起所有數字並填滿格子</span></div><span class="go">開始</span></a><a class="card" href="#queens"><div class="ic" style="background:linear-gradient(135deg,#b07cff,#7b5cff)"><svg viewBox="0 0 100 100" fill="#fff"><ellipse cx="50" cy="66" rx="22" ry="18"/><ellipse cx="22" cy="40" rx="9" ry="12" transform="rotate(-25 22 40)"/><ellipse cx="40" cy="25" rx="9" ry="12" transform="rotate(-8 40 25)"/><ellipse cx="60" cy="25" rx="9" ry="12" transform="rotate(8 60 25)"/><ellipse cx="78" cy="40" rx="9" ry="12" transform="rotate(25 78 40)"/></svg></div><div class="tx"><b>Queens 貓掌版</b><span>每列、每欄、每色塊各放一個貓掌</span></div><span class="go">開始</span></a><a class="card" href="#sudoku"><div class="ic" style="background:linear-gradient(135deg,#4fc3f7,#0a66c2)"><svg viewBox="0 0 100 100"><text x="50" y="58" text-anchor="middle" dominant-baseline="middle" font-size="52" font-weight="800" fill="#fff" font-family="sans-serif">6</text><rect x="12" y="12" width="76" height="76" rx="10" fill="none" stroke="#fff" stroke-width="7"/></svg></div><div class="tx"><b>Mini Sudoku 迷你數獨</b><span>6×6 數獨，填入 1～6</span></div><span class="go">開始</span></a><a class="card" href="#patches"><div class="ic" style="background:linear-gradient(135deg,#5fd39a,#1f9e6e)"><svg viewBox="0 0 100 100" fill="#fff"><rect x="12" y="12" width="44" height="30" rx="6"/><rect x="62" y="12" width="26" height="76" rx="6"/><rect x="12" y="48" width="44" height="40" rx="6" opacity=".7"/></svg></div><div class="tx"><b>Patches 拼布</b><span>依提示把網格切成長方形</span></div><span class="go">開始</span></a><a class="card" href="#match3"><div class="ic" style="background:linear-gradient(135deg,#ffb36b,#ff6fa5)"><svg viewBox="0 0 100 100"><path d="M14 72L20 30L38 50L50 22L62 50L80 30L86 72Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><circle cx="50" cy="60" r="8" fill="#ff7aa8"/></svg></div><div class="tx"><b>皇家消消樂</b><span>三消闖關：火箭、炸彈、彩虹球，共 10 關</span></div><span class="go">開始</span></a><a class="card" href="#bbq"><div class="ic" style="background:linear-gradient(135deg,#ff8a4c,#c0392b)"><svg viewBox="0 0 100 100"><path d="M18 46H82A32 30 0 0 1 18 46Z" fill="#fff"/><g stroke="#fff" stroke-width="4"><path d="M14 46H86"/><path d="M34 74L26 92M66 74L74 92"/></g><g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M34 34Q28 26 34 18"/><path d="M50 34Q44 24 50 14"/><path d="M66 34Q60 26 66 18"/></g></svg></div><div class="tx"><b>燒肉屋｜炭火小老闆</b><span>炭火烤肉經營，掌握火候服務客人達成每日目標</span></div><span class="go">開始</span></a><a class="card" href="#cat2048"><div class="ic" style="background:linear-gradient(135deg,#ffc58a,#e8935a)"><svg viewBox="0 0 100 100"><path d="M16 48L22 12L44 32Z M84 48L78 12L56 32Z" fill="#fff"/><ellipse cx="50" cy="58" rx="36" ry="30" fill="#fff"/><circle cx="38" cy="56" r="5" fill="#e8935a"/><circle cx="62" cy="56" r="5" fill="#e8935a"/><path d="M46 65H54L50 69Z" fill="#ff8fa3"/></svg></div><div class="tx"><b>2048 貓咪進化</b><span>合併相同貓咪，養出黃金星貓</span></div><span class="go">開始</span></a></div>

<script>
const GAMES={"zip": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>Zip 一筆連線<\/title>\n<style>\n*{box-sizing:border-box}body{margin:0;font-family:-apple-system,\"PingFang TC\",\"Noto Sans TC\",\"Microsoft JhengHei\",sans-serif;background:#f4f2ee;color:#1d1d1d;display:flex;justify-content:center;min-height:100vh}\n.app{width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:12px}\nh1{margin:0;font-size:28px;text-align:center}h1 span{color:#0a66c2}\n.sub{text-align:center;color:#666;font-size:14px;margin:0}\n.bar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}\nselect,button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1.5px solid #0a66c2;background:#fff;color:#0a66c2;cursor:pointer}\nbutton.primary{background:#0a66c2;color:#fff}button:active{transform:scale(.96)}\n.board{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:8px;touch-action:none;user-select:none}\ncanvas{width:100%;height:100%;display:block}\n.win{display:none;position:absolute;inset:0;background:rgba(255,255,255,.88);border-radius:18px;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}\n.win.show{display:flex}.win h2{margin:0;font-size:30px}.win p{margin:0;font-size:18px}\n.msg{text-align:center;min-height:22px;color:#b24020;font-size:14px}\n<\/style><\/head><body><div class=\"app\">\n<h1><span>Zip<\/span> 一筆連線<\/h1>\n<p class=\"sub\">從 1 開始依序連到最後一個數字，並填滿每一格<\/p>\n<div class=\"bar\"><select id=\"size\"><option value=\"5\">5×5<\/option><option value=\"6\" selected>6×6<\/option><option value=\"7\">7×7<\/option><\/select><button class=\"primary\" id=\"new\">新題目<\/button><\/div>\n<div class=\"board\" id=\"board\"><canvas id=\"cv\"><\/canvas>\n<div class=\"win\" id=\"win\"><h2>🎉 完成！<\/h2><button class=\"primary\" id=\"again\">再玩一題<\/button><\/div><\/div>\n<div class=\"bar\"><button id=\"undo\">↶ 復原<\/button><button id=\"clear\">清除<\/button><\/div>\n<div class=\"msg\" id=\"msg\"><\/div>\n<\/div>\n<script>\n// ===== Generator (shared with node test) =====\nfunction rnd(n){return Math.floor(Math.random()*n)}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction nbrs(N,c){const r=Math.floor(c/N),k=c%N,o=[];if(r>0)o.push(c-N);if(r<N-1)o.push(c+N);if(k>0)o.push(c-1);if(k<N-1)o.push(c+1);return o}\nfunction hamPath(N){ // snake + backbite\n  let p=[];for(let r=0;r<N;r++)for(let k=0;k<N;k++)p.push(r*N+(r%2?N-1-k:k));\n  const iters=N*N*N*12;\n  for(let t=0;t<iters;t++){\n    if(Math.random()<.5)p.reverse();\n    const end=p[p.length-1],ns=nbrs(N,end),nb=ns[rnd(ns.length)];\n    const i=p.indexOf(nb);if(i===p.length-2)continue;\n    const tail=p.slice(i+1).reverse();p=p.slice(0,i+1).concat(tail);\n  }\n  if(Math.random()<.5)p.reverse();return p;\n}\nfunction wallsFor(N,path){ // random walls on edges not used by path\n  const used=new Set();for(let i=1;i<path.length;i++){const a=Math.min(path[i],path[i-1]),b=Math.max(path[i],path[i-1]);used.add(a+','+b)}\n  const cand=[];for(let c=0;c<N*N;c++)for(const d of nbrs(N,c))if(d>c&&!used.has(c+','+d))cand.push(c+','+d);\n  shuffle(cand);return cand.slice(0,Math.random()<.5?0:rnd(N)+1);\n}\nfunction generate(N){\n  const path=hamPath(N),L=path.length,K=Math.min(L,2+6+rnd(5)+(N-5));\n  const idx=new Set([0,L-1]);\n  // spread checkpoints roughly evenly with jitter\n  const seg=(L-1)/(K-1);\n  for(let j=1;j<K-1;j++){let x=Math.round(j*seg+(Math.random()-.5)*seg*.6);x=Math.max(1,Math.min(L-2,x));while(idx.has(x))x=x<L-2?x+1:1;idx.add(x)}\n  const sorted=[...idx].sort((a,b)=>a-b),nums={};sorted.forEach((x,i)=>nums[path[x]]=i+1);\n  return{N,path,nums,K:sorted.length,walls:wallsFor(N,path)};\n}\nfunction validate(pz,p){ // p = player/solution path\n  const{N,nums,K,walls}=pz,ws=new Set(walls);if(p.length!==N*N||new Set(p).size!==N*N)return false;\n  let next=1;for(let i=0;i<p.length;i++){\n    if(i){const a=p[i-1],b=p[i];if(!nbrs(N,a).includes(b))return false;if(ws.has(Math.min(a,b)+','+Math.max(a,b)))return false}\n    if(nums[p[i]]){if(nums[p[i]]!==next)return false;next++}\n  }\n  return next===K+1&&nums[p[0]]===1&&nums[p[p.length-1]]===K;\n}\nif(typeof module!=='undefined'){module.exports={generate,validate};}\n// ===== UI =====\nif(typeof document!=='undefined'){\nconst cv=document.getElementById('cv'),ctx=cv.getContext('2d'),board=document.getElementById('board');\nlet pz,path=[],hist=[],done=false,drag=false,wset;\nconst $=id=>document.getElementById(id);\nfunction newGame(){pz=generate(+$('size').value);wset=new Set(pz.walls);const s=Object.keys(pz.nums).find(c=>pz.nums[c]===1);path=[+s];hist=[];done=false;$('win').classList.remove('show');$('msg').textContent='';draw()}\nfunction resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;draw()}\nfunction center(c,s){return[(c%pz.N+.5)*s,(Math.floor(c/pz.N)+.5)*s]}\nfunction draw(){if(!pz)return;const W=cv.width,N=pz.N,s=W/N;ctx.clearRect(0,0,W,W);\n  ctx.strokeStyle='#e3e0da';ctx.lineWidth=W*.004;\n  for(let i=1;i<N;i++){ctx.beginPath();ctx.moveTo(i*s,0);ctx.lineTo(i*s,W);ctx.moveTo(0,i*s);ctx.lineTo(W,i*s);ctx.stroke()}\n  // path\n  if(path.length>1){ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=s*.42;\n    for(let i=1;i<path.length;i++){const[a,b]=center(path[i-1],s),[c,d]=center(path[i],s);\n      const h=200+150*(i/(N*N));ctx.strokeStyle=`hsl(${h%360},85%,58%)`;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke()}}\n  else if(path.length){const[a,b]=center(path[0],s);ctx.fillStyle='hsl(200,85%,58%)';ctx.beginPath();ctx.arc(a,b,s*.21,0,7);ctx.fill()}\n  // walls\n  ctx.strokeStyle='#1d1d1d';ctx.lineWidth=s*.09;ctx.lineCap='round';\n  for(const w of pz.walls){const[a,b]=w.split(',').map(Number);const r=Math.floor(a/N),k=a%N;ctx.beginPath();\n    if(b===a+1){ctx.moveTo((k+1)*s,r*s);ctx.lineTo((k+1)*s,(r+1)*s)}else{ctx.moveTo(k*s,(r+1)*s);ctx.lineTo((k+1)*s,(r+1)*s)}ctx.stroke()}\n  // numbers\n  for(const c in pz.nums){const[x,y]=center(+c,s);ctx.fillStyle='#1d1d1d';ctx.beginPath();ctx.arc(x,y,s*.3,0,7);ctx.fill();\n    ctx.fillStyle='#fff';ctx.font=`700 ${s*.3}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pz.nums[c],x,y+s*.01)}\n}\nfunction cellAt(e){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,N=pz.N;\n  const k=Math.floor(x/r.width*N),q=Math.floor(y/r.height*N);return k<0||q<0||k>=N||q>=N?-1:q*N+k}\nfunction lastNum(){let m=0;for(const c of path)if(pz.nums[c])m=pz.nums[c];return m}\nfunction tryMove(c){if(done||c<0)return;const end=path[path.length-1];if(c===end)return;\n  const i=path.indexOf(c);if(i>=0){path=path.slice(0,i+1);draw();return}\n  if(!nbrs(pz.N,end).includes(c)||wset.has(Math.min(c,end)+','+Math.max(c,end)))return;\n  if(pz.nums[c]&&pz.nums[c]!==lastNum()+1)return;\n  path.push(c);draw();check()}\nfunction check(){if(path.length===pz.N*pz.N){if(validate(pz,path)){done=true;try{parent.postMessage({officeSolve:'zip'},parent.location.origin)}catch(e){}setTimeout(()=>$('win').classList.add('show'),250)}else $('msg').textContent='要以最大的數字結尾喔！'}else $('msg').textContent=''}\ncv.addEventListener('pointerdown',e=>{if(done)return;hist.push(path.slice());if(hist.length>200)hist.shift();drag=true;cv.setPointerCapture(e.pointerId);const c=cellAt(e);\n  if(c===path[0]&&path.length>1){path=[path[0]];draw()}else tryMove(c)});\ncv.addEventListener('pointermove',e=>{if(!drag)return;const c=cellAt(e);if(c<0)return;\n  const end=path[path.length-1];// fill skipped cells on fast drags in straight line\n  const N=pz.N,er=Math.floor(end/N),ek=end%N,cr=Math.floor(c/N),ck=c%N;\n  if((er===cr||ek===ck)&&path.indexOf(c)<0){const st=er===cr?(ck>ek?1:-1):(cr>er?N:-N);let x=end;while(x!==c){const b=path.length;tryMove(x+st);if(path.length===b)break;x+=st}}else tryMove(c)});\n['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drag=false;const h=hist[hist.length-1];if(h&&h.join()===path.join())hist.pop()}));\n$('undo').onclick=()=>{if(done)return;if(hist.length)path=hist.pop();else if(path.length>1)path.pop();draw();$('msg').textContent=''};\n$('clear').onclick=()=>{if(done)return;hist.push(path.slice());path=[path[0]];draw()};\n$('new').onclick=newGame;$('again').onclick=newGame;$('size').onchange=newGame;\naddEventListener('resize',resize);newGame();resize();\n}\n<\/script><\/body><\/html>\n", "queens": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>貓掌 Queens<\/title>\n<style>\n*{box-sizing:border-box}body{margin:0;font-family:-apple-system,\"PingFang TC\",\"Noto Sans TC\",\"Microsoft JhengHei\",sans-serif;background:#f4f2ee;color:#1d1d1d;display:flex;justify-content:center;min-height:100vh}\n.app{width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:12px}\nh1{margin:0;font-size:28px;text-align:center}h1 span{color:#0a66c2}\n.sub{text-align:center;color:#666;font-size:14px;margin:0}\n.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}\nselect,button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1.5px solid #0a66c2;background:#fff;color:#0a66c2;cursor:pointer}\nbutton.primary{background:#0a66c2;color:#fff}button:active{transform:scale(.96)}\n.wrap{position:relative;width:100%;aspect-ratio:1}\n.board{display:grid;grid-auto-rows:minmax(0,1fr);width:100%;height:100%;border:3px solid #222;border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#222}\n.cell{position:relative;min-width:0;min-height:0;overflow:hidden;line-height:0;font-size:0;border:0;padding:0;cursor:pointer;\n --t:0px;--l:0px;--b:0px;--r:0px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18),inset 0 var(--t) 0 #222,inset var(--l) 0 0 #222,inset 0 calc(-1*var(--b)) 0 #222,inset calc(-1*var(--r)) 0 0 #222}\n.cell.bt{--t:2.5px}.cell.bl{--l:2.5px}.cell.bb{--b:2.5px}.cell.br{--r:2.5px}\n.cell .x,.cell svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}\n.cell .x{width:40%;height:40%}\n.cell svg{width:68%;height:68%}\n.cell.bad{background-image:repeating-linear-gradient(45deg,rgba(220,30,30,.35) 0 6px,transparent 6px 12px)}\n.cell.bad svg path,.cell.bad svg ellipse{fill:#d42020}\n.cell.hint{animation:pulse .9s ease 2}@keyframes pulse{50%{filter:brightness(.75)}}\n.win{display:none;position:absolute;inset:0;background:rgba(255,255,255,.88);border-radius:12px;flex-direction:column;align-items:center;justify-content:center;gap:14px}\n.win.show{display:flex}.win h2{margin:0;font-size:32px}\n<\/style><\/head><body><div class=\"app\">\n<h1><span>Queens<\/span> 貓掌版 🐾<\/h1>\n<p class=\"sub\">每一列、每一欄、每個顏色區塊各放一個貓掌，貓掌之間不能相鄰（含斜角）<\/p>\n<div class=\"bar\"><select id=\"size\"><option value=\"6\">6×6<\/option><option value=\"7\" selected>7×7<\/option><option value=\"8\">8×8<\/option><\/select>\n<button class=\"primary\" id=\"new\">新題目<\/button><\/div>\n<div class=\"wrap\"><div class=\"board\" id=\"board\"><\/div>\n<div class=\"win\" id=\"win\"><h2>🎉 完成！<\/h2><button class=\"primary\" id=\"again\">再玩一題<\/button><\/div><\/div>\n<div class=\"bar\"><button id=\"undo\">↶ 復原<\/button><button id=\"clear\">清除<\/button><button id=\"hint\">💡 提示<\/button><\/div>\n<p class=\"sub\">點一下：✕ → 貓掌 → 空白；拖曳可連續標記 ✕<\/p>\n<\/div>\n<script>\n// ===== Generator & solver =====\nfunction rnd(n){return Math.floor(Math.random()*n)}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction randPerm(N){ // col of paw in each row, |p[r]-p[r+1]|>1\n  const p=[],used=new Array(N).fill(false);\n  (function bt(r){if(r===N)return true;for(cons ps(){const g=[];for(let k=0;k<6;k++){g.push([...Array(6)].map((_,j)=>k*6+j));g.push([...Array(6)].map((_,j)=>j*6+k))}\n  for(let b=0;b<6;b++)g.push([...Array(36).keys()].filter(i=>box(i)===b));return g}\nconst GROUPS=groups();\nfunction full(gr){return gr.every(i=>val[i]&&ok(val,i,val[i]))}\nfunction glowNew(before){const lit=new Set();GROUPS.forEach((gr,k)=>{if(!before[k]&&full(gr))gr.forEach(i=>lit.add(i))});\n  lit.forEach(i=>{const c=cells[i];c.classList.remove('glow');void c.offsetWidth;c.classList.add('glow');clearTimeout(c._gt);c._gt=setTimeout(()=>c.classList.remove('glow'),900)})}\nfunction snap(){return GROUPS.map(full)}\nfunction input(d){if(done||sel<0||pz.puzzle[sel])return;save();\n  if(noteMode&&!val[sel]){notes[sel].has(d)?notes[sel].delete(d):notes[sel].add(d)}\n  else{const bf=snap();val[sel]=val[sel]===d?0:d;setTimeout(()=>glowNew(bf));if(val[sel])for(let j=0;j<36;j++)if(rel(j,sel))notes[j].delete(d)}render()}\nfunction erase(){if(done||sel<0||pz.puzzle[sel])return;save();val[sel]=0;notes[sel].clear();render()}\nB.addEventListener('click',e=>{const c=e.target.closest('.cell');if(!c||done)return;sel=+c.dataset.i;render()});\ndocument.addEventListener('keydown',e=>{if(done)return;if(e.key>='1'&&e.key<='6')input(+e.key);else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')erase();\n  else if(e.key==='n'||e.key==='N')$('notes').click();\n  else{const m={ArrowUp:-6,ArrowDown:6,ArrowLeft:-1,ArrowRight:1}[e.key];if(m===undefined)return;e.preventDefault();\n    if(sel<0)sel=0;else{const r=Math.floor(sel/6),c=sel%6;if(m===-1&&c>0||m===1&&c<5||m===-6&&r>0||m===6&&r<5)sel+=m}render()}});\n$('erase').onclick=erase;$('notes').onclick=()=>{noteMode=!noteMode;$('notes').classList.toggle('on',noteMode)};\n$('undo').onclick=()=>{if(done||!hist.length)return;const h=hist.pop();val=h.v;notes=h.n;render()};\n$('clear').onclick=()=>{if(done)return;save();val=pz.puzzle.slice();notes.forEach(s=>s.clear());render()};\n$('hint').onclick=()=>{if(done)return;let t=val.findIndex((v,i)=>v&&v!==pz.sol[i]);\n  if(t<0){const e=[...Array(36).keys()].filter(i=>!val[i]);if(!e.length)return;t=sel>=0&&!val[sel]?sel:e[rnd(e.length)]}\n  save();const bf=snap();val[t]=pz.sol[t];sel=t;render();glowNew(bf);cells[t].classList.remove('hint');void cells[t].offsetWidth;cells[t].classList.add('hint')};\n$('new').onclick=newGame;$('again').onclick=newGame;$('diff').onchange=newGame;newGame();\n}\n<\/script><\/body><\/html>\n", "patches": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>Patches 拼布<\/title>\n<style>\n*{box-sizing:border-box}body{margin:0;font-family:-apple-system,\"PingFang TC\",\"Noto Sans TC\",\"Microsoft JhengHei\",sans-serif;background:#f4f2ee;color:#1d1d1d;display:flex;justify-content:center;min-height:100vh}\n.app{width:100%;max-width:520px;padding:16px;display:flex;flex-direction:column;gap:12px}\nh1{margin:0;font-size:28px;text-align:center}h1 span{color:#0a66c2}\n.sub{text-align:center;color:#666;font-size:14px;margin:0;line-height:1.5}\n.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}\nselect,button{font:inherit;font-size:15px;padding:8px 14px;border-radius:999px;border:1.5px solid #0a66c2;background:#fff;color:#0a66c2;cursor:pointer;touch-action:manipulation}\nbutton.primary{background:#0a66c2;color:#fff}button:active{transform:scale(.96)}\n.wrap{position:relative;width:100%;aspect-ratio:1;border:3px solid #222;border-radius:12px;overflow:hidden;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}\n.board,.layer{position:absolute;inset:0;display:grid}\n.layer{pointer-events:none}\n.cell{position:relative;min-width:0;min-height:0;overflow:hidden;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}\n.patch{position:relative;min-width:0;min-height:0;margin:3px;border-radius:8px;border:2.5px solid rgba(0,0,0,.55)}\n.patch.bad{border:2.5px dashed #d42020;background-image:repeating-linear-gradient(45deg,rgba(220,30,30,.18) 0 6px,transparent 6px 12px)!important}\n.patch.preview{border:2.5px dashed #0a66c2;background:rgba(10,102,194,.15)}\n.patch.hint{animation:pulse .9s ease 2}@keyframes pulse{50%{filter:brightness(.8)}}\n.clue{position:relative;min-width:0;min-height:0}\n.clue svg{position:absolute;left:50%;top:50%;width:76%;height:76%;transform:translate(-50%,-50%)}\n.win{display:none;position:absolute;inset:0;background:rgba(255,255,255,.88);flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}\n.win.show{display:flex}.win h2{margin:0;font-size:32px}\n.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:13px;color:#555}\n.legend span{display:flex;align-items:center;gap:4px}.legend svg{width:22px;height:22px}\n<\/style><\/head><body><div class=\"app\">\n<h1><span>Patches<\/span> 拼布<\/h1>\n<p class=\"sub\">把網格切成長方形，每塊恰好包含一個提示，並符合提示的格數與形狀，不得重疊、填滿全部格子<\/p>\n<div class=\"bar\"><select id=\"size\"><option value=\"5\">5×5<\/option><option value=\"6\" selected>6×6<\/option><option value=\"7\">7×7<\/option><\/select>\n<button class=\"primary\" id=\"new\">新題目<\/button><\/div>\n<div class=\"wrap\" id=\"wrap\"><div class=\"board\" id=\"board\"><\/div><div class=\"layer\" id=\"layer\"><\/div><div class=\"layer\" id=\"clues\"><\/div>\n<div class=\"win\" id=\"win\"><h2>🎉 完成！<\/h2><button class=\"primary\" id=\"again\">再玩一題<\/button><\/div><\/div>\n<div class=\"bar\"><button id=\"undo\">↶ 復原<\/button><button id=\"clear\">清除<\/button><button id=\"hint\">💡 提示<\/button><\/div>\n<div class=\"legend\" id=\"legend\"><\/div>\n<p class=\"sub\">拖曳畫出長方形；點一下已畫的區塊可刪除<\/p>\n<\/div>\n<script>\n// ===== Generator & solver =====\n// shapes: 'sq' square, 'w' wide (w>h), 't' tall (h>w), 'f' free. clue: {r,c,shape,n|null}\nfunction rnd(n){return Math.floor(Math.random()*n)}\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}\nfunction shapeOf(w,h){return w===h?'sq':w>h?'w':'t'}\nfunction partition(N){const cov=new Array(N*N).fill(false),rects=[];const maxA=N<=5?6:8;\n  for(let i=0;i<N*N;i++){if(cov[i])continue;const r=Math.floor(i/N),c=i%N;let mw=0;while(c+mw<N&&!cov[r*N+c+mw])mw++;\n    const opts=[];for(let w=1;w<=mw;w++)for(let h=1;r+h<=N;h++){let okk=true;for(let x=0;x<w;x++)if(cov[(r+h-1)*N+c+x])okk=false;if(!okk)break;\n      const a=w*h;if(a>maxA)break;opts.push({w,h,wt:a===1?.15:a===2?.6:1})}\n    let s=opts.reduce((a,o)=>a+o.wt,0)*Math.random(),o=opts[0];for(const q of opts){s-=q.wt;if(s<=0){o=q;break}}\n    for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++)cov[(r+y)*N+c+x]=true;rects.push({r,c,w:o.w,h:o.h})}\n  return rects}\nfunction fits(cl,w,h){return(cl.n==null||w*h===cl.n)&&(cl.shape==='f'||shapeOf(w,h)===cl.shape)}\nfunction candidates(N,clues){const at=new Map();clues.forEach((q,k)=>at.set(q.r*N+q.c,k));\n  return clues.map((q,k)=>{const out=[];for(let r=0;r<=q.r;r++)for(let c=0;c<=q.c;c++)for(let h=q.r-r+1;r+h<=N;h++)for(let w=q.c-c+1;c+w<=N;w++){\n    if(!fits(q,w,h))continue;let okk=true;for(let y=0;y<h&&okk;y++)for(let x=0;x<w;x++){const j=at.get((r+y)*N+c+x);if(j!==undefined&&j!==k){okk=false;break}}\n    if(okk)out.push({r,c,w,h,k})}return out})}\nfunction solve(N,clues,limit){const cand=candidates(N,clues),byCell=Array.from({length:N*N},()=>[]);\n  cand.forEach(l=>l.forEach(o=>{for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++)byCell[(o.r+y)*N+o.c+x].push(o)}));\n  const cov=new Array(N*N).fill(false),used=new Array(clues.length).fill(false),cur=[],sols=[];\n  (function bt(){if(sols.length>=limit)return;const i=cov.indexOf(false);if(i<0){sols.push(cur.slice());return}\n    for(const o of byCell[i]){if(used[o.k])continue;let okk=true;for(let y=0;y<o.h&&okk;y++)for(let x=0;x<o.w;x++)if(cov[(o.r+y)*N+o.c+x]){okk=false;break}\n      if(!okk)continue;const set=v=>{for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++)cov[(o.r+y)*N+o.c+x]=v};set(true);used[o.k]=true;cur.push(o);bt();cur.pop();used[o.k]=false;set(false)}})();\n  return sols}\nfunction generate(N){for(let t=1;;t++){const rects=shuffle(partition(N));\n  const clues=rects.map(R=>({r:R.r+rnd(R.h),c:R.c+rnd(R.w),shape:shapeOf(R.w,R.h),n:R.w*R.h}));\n  if(solve(N,clues,2).length!==1)continue;\n  // weaken some clues (hide number or shape) while keeping uniqueness\n  for(const k of shuffle([...clues.keys()]).slice(0,Math.ceil(clues.length*.45))){const q=clues[k],old={shape:q.shape,n:q.n};\n    if(Math.random()<.5&&q.shape!=='sq')q.n=null;else q.shape='f';\n    if(solve(N,clues,2).length!==1){q.shape=old.shape;q.n=old.n}}\n  return{N,clues,sol:rects.map(R=>{const k=clues.findIndex(q=>q.r>=R.r&&q.r<R.r+R.h&&q.c>=R.c&&q.c<R.c+R.w);return{...R,k}}),tries:t}}}\nif(typeof module!=='undefined')module.exports={generate,solve,fits};\n// ===== UI =====\nif(typeof document!=='undefined'){\nconst COLORS=['#f7c6c7','#c9e4ff','#d4f0c4','#ffe7a8','#e2d1f9','#ffd2b0','#bfeee8','#f3c9e8','#dfe8b0','#c7d3f7','#f9dcc4','#cdeccd'];\nconst DARK=['#c0565a','#3f7fc2','#4f9a3f','#c49a1c','#8a62c4','#d07a3a','#2f9e92','#b85aa0','#7d8f2a','#5068c0','#c08050','#4f9a5f'];\nconst $=id=>document.getElementById(id);let pz,placed,hist,done,down=null,cur=null,clueAt;\nfunction icon(shape,n,col){const g={sq:'<rect x=\"22\" y=\"22\" width=\"56\" height=\"56\" rx=\"8\"/>',w:'<rect x=\"10\" y=\"28\" width=\"80\" height=\"44\" rx=\"8\"/>',t:'<rect x=\"28\" y=\"10\" width=\"44\" height=\"80\" rx=\"8\"/>',\n  f:'<rect x=\"8\" y=\"14\" width=\"56\" height=\"44\" rx=\"8\" stroke-dasharray=\"7 6\"/><rect x=\"36\" y=\"42\" width=\"56\" height=\"44\" rx=\"8\" stroke-dasharray=\"7 6\"/>'}[shape];\n  return `<svg viewBox=\"0 0 100 100\"><g fill=\"${shape==='f'?'none':col}\" stroke=\"${shape==='f'?col:'#fff'}\" stroke-width=\"${shape==='f'?4:5}\" ${shape==='f'&&n!=null?'opacity=\".45\"':''}>${g}<\/g>`+\n  (n!=null?(shape==='f'?`<text x=\"50\" y=\"53\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"46\" font-weight=\"800\" fill=\"${col}\" stroke=\"#fff\" stroke-width=\"12\" stroke-linejoin=\"round\" paint-order=\"stroke\" font-family=\"sans-serif\">${n}<\/text>`\n   :`<text x=\"50\" y=\"53\" text-anchor=\"middle\" dominant-baseline=\"middle\" font-size=\"42\" font-weight=\"800\" fill=\"#fff\" stroke=\"rgba(0,0,0,.25)\" stroke-width=\"3\" paint-order=\"stroke\" font-family=\"sans-serif\">${n}<\/text>`):'')+'<\/svg>'}\n$('legend').innerHTML=[['sq','正方形'],['w','寬長方形'],['t','高長方形'],['f','任意形狀']].map(([s,t])=>`<span>${icon(s,null,'#666')}${t}<\/span>`).join('');\nfunction grid(el,N){el.style.gridTemplateColumns=el.style.gridTemplateRows=`repeat(${N},minmax(0,1fr))`}\nfunction newGame(){const N=+$('size').value;pz=generate(N);placed=[];hist=[];done=false;$('win').classList.remove('show');\n  clueAt=new Map();pz.clues.forEach((q,k)=>clueAt.set(q.r*N+q.c,k));\n  ['board','layer','clues'].forEach(id=>grid($(id),N));$('board').innerHTML='';\n  for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='cell';$('board').appendChild(d)}\n  $('clues').innerHTML=pz.clues.map((q,k)=>`<div class=\"clue\" style=\"grid-area:${q.r+1}/${q.c+1}/span 1/span 1\">${icon(q.shape,q.n,DARK[k%12])}<\/div>`).join('');render()}\nfunction inside(o,r,c){return r>=o.r&&r<o.r+o.h&&c>=o.c&&c<o.c+o.w}\nfunction cluesIn(o){return pz.clues.map((q,k)=>inside(o,q.r,q.c)?k:-1).filter(k=>k>=0)}\nfunction valid(o){const ks=cluesIn(o);return ks.length===1&&fits(pz.clues[ks[0]],o.w,o.h)}\nfunction render(extra){let h='';for(const o of placed){const ks=cluesIn(o),col=ks.length===1?COLORS[ks[0]%12]:'#e6e6e6';\n  h+=`<div class=\"patch${valid(o)?'':' bad'}${o.hint?' hint':''}\" style=\"grid-area:${o.r+1}/${o.c+1}/span ${o.h}/span ${o.w};background:${col}\"><\/div>`;o.hint=false}\n  if(cur)h+=`<div class=\"patch preview\" style=\"grid-area:${cur.r+1}/${cur.c+1}/span ${cur.h}/span ${cur.w};background:transparent\"><\/div>`;$('layer').innerHTML=h;\n  const N=pz.N,area=placed.reduce((a,o)=>a+o.w*o.h,0);\n  if(!down&&area===N*N&&placed.length===pz.clues.length&&placed.every(valid)){done=true;try{parent.postMessage({officeSolve:'patches'},parent.location.origin)}catch(e){}setTimeout(()=>$('win').classList.add('show'),300)}}\nfunction cellAt(e){const b=$('wrap').getBoundingClientRect(),N=pz.N;const c=Math.floor((e.clientX-b.left)/b.width*N),r=Math.floor((e.clientY-b.top)/b.height*N);\n  return{r:Math.max(0,Math.min(N-1,r)),c:Math.max(0,Math.min(N-1,c))}}\nfunction rectOf(a,b){return{r:Math.min(a.r,b.r),c:Math.min(a.c,b.c),h:Math.abs(a.r-b.r)+1,w:Math.abs(a.c-b.c)+1}}\nfunction overlap(a,b){return a.r<b.r+b.h&&b.r<a.r+a.h&&a.c<b.c+b.w&&b.c<a.c+a.w}\nfunction save(){hist.push(placed.map(o=>({...o})));if(hist.length>300)hist.shift()}\nconst W=$('wrap');\nlet base=null,origin=null,moved=false;\nfunction union(a,b){const r=Math.min(a.r,b.r),c=Math.min(a.c,b.c);return{r,c,h:Math.max(a.r+a.h,b.r+b.h)-r,w:Math.max(a.c+a.w,b.c+b.w)-c}}\nfunction shrink(p,o){ // largest sub-rect of p not overlapping o, keeping p's clue(s) if any\n  const ks=cluesIn(p);let best=null;\n  for(let r=p.r;r<p.r+p.h;r++)for(let c=p.c;c<p.c+p.w;c++)for(let h=1;r+h<=p.r+p.h;h++)for(let w=1;c+w<=p.c+p.w;w++){\n    const q={r,c,w,h};if(overlap(q,o))continue;if(ks.length&&!ks.every(k=>inside(q,pz.clues[k].r,pz.clues[k].c)))continue;\n    if(!best||w*h>best.w*best.h)best=q}\n  return best}\nfunction live(){const out=[];for(const p of base){if(p===origin)continue;if(!overlap(p,cur)){out.push({...p});continue}const q=shrink(p,cur);if(q)out.push(q)}out.push({...cur});return out}\nW.addEventListener('pointerdown',e=>{if(done)return;e.preventDefault();down=cellAt(e);W.setPointerCapture(e.pointerId);\n  base=placed;origin=placed.find(p=>inside(p,down.r,down.c))||null;moved=false;\n  if(!origin){cur=rectOf(down,down);placed=live()}render()});\nW.addEventListener('pointermove',e=>{if(!down)return;const at=cellAt(e);if(!moved&&at.r===down.r&&at.c===down.c)return;\n  let n=rectOf(down,at);if(origin)n=union(origin,n);if(moved&&cur&&n.r===cur.r&&n.c===cur.c&&n.w===cur.w&&n.h===cur.h)return;\n  moved=true;cur=n;placed=live();render()});\nW.addEventListener('pointerup',()=>{if(!down)return;down=null;\n  if(!moved&&origin){placed=base.filter(p=>p!==origin)} // tap deletes\n  cur=null;hist.push(base.map(o=>({...o})));if(hist.length>300)hist.shift();base=null;origin=null;render()});\nW.addEventListener('pointercancel',()=>{if(base)placed=base;down=cur=null;base=origin=null;render()});\n$('undo').onclick=()=>{if(done||!hist.length)return;placed=hist.pop();render()};\n$('clear').onclick=()=>{if(done)return;save();placed=[];render()};\n$('hint').onclick=()=>{if(done)return;const same=(a,b)=>a.r===b.r&&a.c===b.c&&a.w===b.w&&a.h===b.h;\n  const wrong=placed.find(p=>!pz.sol.some(s=>same(s,p)));save();\n  if(wrong){placed=placed.filter(p=>p!==wrong)}else{const m=pz.sol.filter(s=>!placed.some(p=>same(p,s)));if(!m.length)return;const s=m[rnd(m.length)];\n    placed=placed.filter(p=>!overlap(p,s));placed.push({r:s.r,c:s.c,w:s.w,h:s.h,hint:true})}render()};\n$('new').onclick=newGame;$('again').onclick=newGame;$('size').onchange=newGame;newGame();\n}\n<\/script><\/body><\/html>\n", "match3": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\"><head><meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\n<title>皇家消消樂<\/title>\n<style>\n*{box-sizing:border-box}html,body{margin:0;min-height:100%}\nbody{font-family:-apple-system,\"PingFang TC\",\"Noto Sans TC\",\"Microsoft JhengHei\",sans-serif;background:linear-gradient(180deg,#e9e4ff,#fde9f3);color:#2d2350;display:flex;justify-content:center;min-height:100vh}\n.app{width:100%;max-width:520px;padding:14px;display:flex;flex-direction:column;gap:12px}\nh1{margin:0;text-align:center;font-size:28px;color:#5b3fc4}h1 small{display:block;font-size:14px;color:#8a7bb8;font-weight:400;margin-top:2px}\nbutton{font:inherit;font-size:15px;padding:8px 16px;border-radius:999px;border:0;background:#fff;color:#5b3fc4;cursor bsolute;inset:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr))}\n.bg div{min-width:0;min-height:0}.bg div:nth-child(odd){background:#efeaff}.bg div:nth-child(even){background:#e2dafc}\n.bg .r1:nth-child(odd){background:#e2dafc}.bg .r1:nth-child(even){background:#efeaff}\n.bg div.grass{background:#9fdc8a!important;box-shadow:inset 0 0 0 2px #7cc566}\n.tile{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .18s ease-in;will-change:transform}\n.tile .in{position:absolute;inset:6%;transition:transform .18s,opacity .18s}\n.tile svg{width:100%;height:100%;display:block}\n.tile.sel .in{transform:scale(1.15);filter:drop-shadow(0 0 4px #fff)}\n.tile.pop .in{transform:scale(0);opacity:0}\n.tile.hit .in{animation:shake .25s}@keyframes shake{25%{transform:translateX(-8%)}75%{transform:translateX(8%)}}\n.tile.new .in{animation:grow .25s}@keyframes grow{from{transform:scale(0)}}\n.toolbar{display:flex;justify-content:space-between;align-items:center}\n.ov{position:fixed;inset:0;background:rgba(40,25,90,.45);display:none;align-items:center;justify-content:center;z-index:9}\n.ov.show{display:flex}.card{background:#fff;border-radius:22px;padding:24px 28px;text-align:center;min-width:260px;box-shadow:0 10px 30px rgba(0,0,0,.25)}\n.card h2{margin:0 0 8px;font-size:30px;color:#5b3fc4}.card .stars{font-size:40px;letter-spacing:4px;color:#ffc93c;margin:6px 0 14px}.card .stars i{font-style:normal;color:#ddd}\n.card .row{display:flex;gap:10px;justify-content:center}\n.hide{display:none!important}\n<\/style><\/head><body><div class=\"app\">\n<div id=\"mapView\"><h1>👑 皇家消消樂<small>交換相鄰寶石，連成三個就能消除<\/small><\/h1><div class=\"map\" id=\"map\"><\/div><\/div>\n<div id=\"gameView\" class=\"hide\" style=\"display:flex;flex-direction:column;gap:12px\">\n <div class=\"toolbar\"><button id=\"toMap\">← 關卡<\/button><b id=\"lvTitle\"><\/b><button id=\"restart\">↻ 重玩<\/button><\/div>\n <div class=\"hud\"><div class=\"box\"><span class=\"k\">剩餘步數<\/span><span class=\"v\" id=\"moves\">0<\/span><\/div><div class=\"box goals\" id=\"goals\"><\/div><\/div>\n <div class=\"board\" id=\"board\"><div class=\"inner\" id=\"inner\"><div class=\"bg\" id=\"bg\"><\/div><\/div><\/div>\n <p style=\"margin:0;text-align:center;font-size:13px;color:#8a7bb8\">四連 → 火箭｜L、T 或 2×2 → 炸彈｜五連 → 彩虹球；特殊寶石互換有更強效果<\/p>\n<\/div>\n<div class=\"ov\" id=\"ov\"><div class=\"card\"><h2 id=\"ovTitle\"><\/h2><div class=\"stars\" id=\"ovStars\"><\/div><p id=\"ovText\" style=\"margin:0 0 16px;color:#666\"><\/p>\n <div class=\"row\"><button id=\"ovRetry\">重玩<\/button><button class=\"primary\" id=\"ovNext\">下一關<\/button><\/div><\/div><\/div>\n<\/div>\n<script>\n// ===== art =====\nconst COL=[['#ff8fa3','#e8466a'],['#8fd3ff','#3a8de0'],['#a6e88f','#3fae4c'],['#ffe27a','#f0a818'],['#d7a6ff','#9a55e8'],['#ffc08a','#f07a2a']];\nconst SHAPE=['<path d=\"M50 86C20 63 8 46 14 31C20 16 40 15 50 31C60 15 80 16 86 31C92 46 80 63 50 86Z\"/>',\n'<path d=\"M50 9C68 37 81 51 81 65A31 31 0 0 1 19 65C19 51 32 37 50 9Z\"/>',\n'<path d=\"M50 9L86 30V70L50 91L14 70V30Z\"/>',\n'<path d=\"M50 7L62 36L93 38L68 57L77 89L50 71L23 89L32 57L7 38L38 36Z\"/>',\n'<path d=\"M50 7L89 50L50 93L11 50Z\"/>',\n'<circle cx=\"50\" cy=\"50\" r=\"38\"/>'];\nfunction gem(t,sp){if(sp==='rainbow')return'<svg viewBox=\"0 0 100 100\"><defs><linearGradient id=\"rb\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ff6b8b\"/><stop offset=\".35\" stop-color=\"#ffd84a\"/><stop offset=\".65\" stop-color=\"#5fd38a\"/><stop offset=\"1\" stop-color=\"#6a8bff\"/><\/linearGradient><\/defs><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"url(#rb)\" stroke=\"#fff\" stroke-width=\"5\"/><circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"#fff\" opacity=\".85\"/><ellipse cx=\"36\" cy=\"32\" rx=\"10\" ry=\"6\" fill=\"#fff\" opacity=\".7\"/><\/svg>';\n  const [a,b]=COL[t];let s=`<svg viewBox=\"0 0 100 100\"><defs><linearGradient id=\"g${t}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"${a}\"/><stop offset=\"1\" stop-color=\"${b}\"/><\/linearGradient><\/defs><g fill=\"url(#g${t})\" stroke=\"#fff\" stroke-width=\"4\" stroke-linejoin=\"round\">${SHAPE[t]}<\/g><ellipse cx=\"38\" cy=\"36\" rx=\"9\" ry=\"5\" fill=\"#fff\" opacity=\".65\" transform=\"rotate(-25 38 36)\"/>`;\n  if(sp==='rh')s+='<g stroke=\"#fff\" stroke-width=\"7\" stroke-linecap=\"round\"><path d=\"M18 50H82M28 38L16 50L28 62M72 38L84 50L72 62\" fill=\"none\"/><\/g>';\n  if(sp==='rv')s+='<g stroke=\"#fff\" stroke-width=\"7\" stroke-linecap=\"round\"><path d=\"M50 18V82M38 28L50 16L62 28M38 72L50 84L62 72\" fill=\"none\"/><\/g>';\n  if(sp==='bomb')s+='<circle cx=\"50\" cy=\"56\" r=\"20\" fill=\"#3a2a5a\" stroke=\"#fff\" stroke-width=\"4\"/><path d=\"M60 40Q66 28 76 26\" stroke=\"#fff\" stroke-width=\"4\" fill=\"none\"/><circle cx=\"78\" cy=\"25\" r=\"5\" fill=\"#ffd84a\"/>';\n  return s+'<\/svg>'}\nfunction crateSvg(hp){return`<svg viewBox=\"0 0 100 100\"><rect x=\"8\" y=\"8\" width=\"84\" height=\"84\" rx=\"10\" fill=\"${hp>1?'#a86a3a':'#d39a5e'}\" stroke=\"#6e3f1c\" stroke-width=\"5\"/><path d=\"M14 14L86 86M86 14L14 86\" stroke=\"#6e3f1c\" stroke-width=\"7\" opacity=\".55\"/>${hp>1?'<rect x=\"8\" y=\"42\" width=\"84\" height=\"16\" fill=\"#8a8a9a\" stroke=\"#555\" stroke-width=\"3\"/>':''}<\/svg>`}\nconst GRASS_ICON='<svg viewBox=\"0 0 100 100\"><rect x=\"10\" y=\"10\" width=\"80\" height=\"80\" rx=\"14\" fill=\"#9fdc8a\" stroke=\"#5fae4a\" stroke-width=\"5\"/><path d=\"M30 70L36 44L42 70M46 70L52 36L58 70M62 70L68 46L74 70\" fill=\"#3f9a3a\"/><\/svg>';\n// ===== levels =====\n// layout rows: '.' tile, 'c' crate(1), 'C' crate(2); grass rows: 'g' grass\nconst E='........';\nconst LEVELS=[\n{moves:20,types:5,goals:{c0:15}},\n{moves:20,types:5,goals:{c1:15,c2:15}},\n{moves:22,types:5,layout:[E,E,E,'cccccccc',E,E,E,E]},\n{moves:22,types:5,grass:[E,E,'..gggg..','..gggg..','..gggg..','..gggg..',E,E]},\n{moves:24,types:5,goals:{c4:20},layout:[E,E,'.C....C.',E,'..C..C..',E,'.C....C.',E]},\n{moves:25,types:5,grass:[E,E,E,E,E,'gggggggg','gggggggg','gggggggg']},\n{moves:25,types:6,goals:{c3:15,c5:15}},\n{moves:28,types:6,layout:[E,'cc....cc',E,'...cc...','...cc...',E,'cc....cc',E],grass:['gggggggg',E,E,E,E,E,E,'gggggggg']},\n{moves:28,types:6,layout:[E,E,'CC....CC','.cc..cc.','.cc..cc.','CC....CC',E,E]},\n{moves:30,types:6,goals:{c0:20},layout:[E,E,E,'c.c..c.c',E,E,E,E],grass:[E,'gggggggg','gggggggg','g.g..g.g','gggggggg','gggggggg',E,E]},\n];\n// ===== storage (localStorage, fallback memory + parent postMessage) =====\nconst SKEY='royalMatch3';let mem={unlocked:1,stars:[]};\nfunction loadProg(){try{const d=JSON.parse(localStorage.getItem(SKEY));if(d)mem=d}catch(e){}return mem}\nfunction saveProg(){try{localStorage.setItem(SKEY,JSON.stringify(mem))}catch(e){}try{if(parent!==window)parent.postMessage({m3save:mem},parent.location.origin)}catch(e){}}\naddEventListener('message',e=>{const d=e.data&&e.data.m3data;if(d&&d.unlocked>mem.unlocked){mem=d;drawMap()}});\n// ===== state =====\nconst N=8,$=id=>document.getElementById(id);\nlet grid,grass,lv,L,moves,goal,busy=false,sel=null,nextId=1,els=new Map(),over=false;\nconst rnd=n=>Math.floor(Math.random()*n),sleep=m=>new Promise(r=>setTimeout(r,m)),K=(r,c)=>r*N+c;\nfunction tile(t,sp){return{id:nextId++,t,sp:sp||null}}\nfunction isGem(x){return x&&!x.crate}\nfunction matchable(x){return x&&!x.crate&&x.sp!=='rainbow'}\nfunction startLevel(i){lv=i;L=LEVELS[i];moves=L.moves;over=false;sel=null;busy=false;\n  grid=[];grass=[];goal={};for(const k in L.goals||{})goal[k]={need:L.goals[k],got:0};\n  let crates=0,gr=0;\n  for(let r=0;r<N;r++){grid.push([]);grass.push([]);for(let c=0;c<N;c++){\n    const ch=(L.layout||[])[r]?.[c]||'.';const g=(L.grass||[])[r]?.[c]==='g';grass[r].push(g);if(g)gr++;\n    if(ch==='c'||ch==='C'){grid[r].push({id:nextId++,crate:true,hp:ch==='C'?2:1,t:-1});crates++;continue}\n    let t;do{t=rnd(L.types)}while((c>=2&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>=2&&grid[r-1][c].t===t&&grid[r-2][c].t===t)||(r>=1&&c>=1&&grid[r-1][c].t===t&&grid[r][c-1].t===t&&grid[r-1][c-1].t===t));\n    grid[r].push(tile(t))}}\n  if(crates)goal.crate={need:crates,got:0};if(gr)goal.grass={need:gr,got:0};\n  if(!hasMove())shuffleBoard(true);\n  for(const el of els.values())el.remove();els.clear();\n  $('bg').innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');if(r%2)d.className='r1';$('bg').appendChild(d)}\n  $('mapView').classList.add('hide');$('gameView').classList.remove('hide');$('ov').classList.remove('show');\n  $('lvTitle').textContent=`第 ${i+1} 關`;render();hud()}\nfunction hud(){$('moves').textContent=moves;let h='';\n  for(const k in goal){const g=goal[k],left=Math.max(0,g.need-g.got);\n    const ic=k==='crate'?crateSvg(1):k==='grass'?GRASS_ICON:gem(+k.slice(1));h+=`<span class=\"goal${left?'':' ok'}\">${ic}${left?left:'✓'}<\/span>`}\n  $('goals').innerHTML=h;\n  [...$('bg').children].forEach((d,i)=>d.classList.toggle('grass',grass[Math.floor(i/N)][i%N]))}\nfunction render(spawn){const live=new Set();\n  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=grid[r][c];if(!x)continue;live.add(x.id);let el=els.get(x.id);\n    if(!el){el=document.createElement('div');el.className='tile';el.innerHTML='<div class=\"in\"><\/div>';\n      const sr=spawn&&spawn.has(x.id)?spawn.get(x.id):r;el.style.transition='none';el.style.transform=`translate(${c*100}%,${sr*100}%)`;\n      $('inner').appendChild(el);els.set(x.id,el);void el.offsetWidth;el.style.transition='';if(!spawn||!spawn.has(x.id))el.classList.add('new')}\n    const key=x.crate?'c'+x.hp:x.t+'_'+x.sp;if(el.dataset.k!==key){el.dataset.k=key;el.firstChild.innerHTML=x.crate?crateSvg(x.hp):gem(x.t,x.sp)}\n    el.style.transform=`translate(${c*100}%,${r*100}%)`;el.classList.toggle('sel',!!sel&&sel.r===r&&sel.c===c)}\n  for(const [id,el] of els)if(!live.has(id)){els.delete(id);el.classList.add('pop');setTimeout(()=>el.remove(),200)}}\n// ===== matching =====\nfunction findGroups(){const runs=[];\n  for(let r=0;r<N;r++)for(let c=0;c<N;){const x=grid[r][c];let e=c+1;if(matchable(x))while(e<N&&matchable(grid[r][e])&&grid[r][e].t===x.t)e++;\n    if(e-c>=3)runs.push({d:'h',cells:[...Array(e-c)].map((_,i)=>[r,c+i])});c=e}\n  for(let c=0;c<N;c++)for(let r=0;r<N;){const x=grid[r][c];let e=r+1;if(matchable(x))while(e<N&&matchable(grid[e][c])&&grid[e][c].t===x.t)e++;\n    if(e-r>=3)runs.push({d:'v',cells:[...Array(e-r)].map((_,i)=>[r+i,c])});r=e}\n  for(let r=0;r<N-1;r++)for(let c=0;c<N-1;c++){const q=[[r,c],[r,c+1],[r+1,c],[r+1,c+1]];if(q.every(([a,b])=>matchable(grid[a][b])&&grid[a][b].t===grid[r][c].t))runs.push({d:'s',cells:q})}\n  // merge runs sharing cells\n  const groups=[];for(const run of runs){const ks=new Set(run.cells.map(([a,b])=>K(a,b)));\n    let g={runs:[run],keys:ks};for(let i=groups.length-1;i>=0;i--){if([...groups[i].keys].some(k=>ks.has(k))){g.runs.push(...groups[i].runs);groups[i].keys.forEach(k=>g.keys.add(k));groups.splice(i,1)}}\n    groups.push(g)}\n  // squares alone that overlap a straight run are just part of it; a square-only group -> bomb\n  for(const g of groups){const lines=g.runs.filter(x=>x.d!=='s'),mx=Math.max(0,...lines.map(x=>x.cells.length));\n    const hv=lines.some(x=>x.d==='h')&&lines.some(x=>x.d==='v');\n    g.sp=mx>=5?'rainbow':hv?'bomb':mx===4?(lines.find(x=>x.cells.length===4).d==='h'?'rh':'rv'):g.runs.some(x=>x.d==='s')?'bomb':null;\n    if(g.sp==='bomb'&&!hv&&lines.length&&g.keys.size<5)g.sp=null}\n  return groups}\nfunction hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;\n  const a=grid[r][c],b=grid[r2][c2];if(!isGem(a)||!isGem(b))continue;if(a.sp||b.sp)return true;\n  grid[r][c]=b;grid[r2][c2]=a;const ok=findGroups().length>0;grid[r][c]=a;grid[r2][c2]=b;if(ok)return true}return false}\nfunction shuffleBoard(silent){const pos=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(isGem(grid[r][c])&&!grid[r][c].sp)pos.push([r,c]);\n  for(let t=0;t<200;t++){const items=pos.map(([r,c])=>grid[r][c]);for(let i=items.length-1;i>0;i--){const j=rnd(i+1);[items[i],items[j]]=[items[j],items[i]]}\n    pos.forEach(([r,c],i)=>grid[r][c]=items[i]);if(!findGroups().length&&hasMove())break;\n    if(t===199)pos.forEach(([r,c])=>grid[r][c].t=rnd(L.types))}\n  if(!silent)render()}\n// ===== clearing =====\nfunction effectCells(r,c,sp,t){const out=[];\n  if(sp==='rh')for(let x=0;x<N;x++)out.push([r,x]);\n  if(sp==='rv')for(let x=0;x<N;x++)out.push([x,c]);\n  if(sp==='bomb')for(let a=r-1;a<=r+1;a++)for(let b=c-1;b<=c+1;b++)out.push([a,b]);\n  if(sp==='rainbow'){const col=t>=0?t:pickColor();for(let a=0;a<N;a++)for(let b=0;b<N;b++)if(matchable(grid[a][b])&&grid[a][b].t===col)out.push([a,b])}\n  return out.filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N)}\nfunction pickColor(){const cnt={};for(const row of grid)for(const x of row)if(matchable(x))cnt[x.t]=(cnt[x.t]||0)+1;const ks=Object.keys(cnt);return ks.length?+ks[rnd(ks.length)]:0}\nfunction count(k,n){if(goal[k])goal[k].got+=n||1}\nasync function blast(cells,create){const q=cells.map(([r,c])=>K(r,c)),seen=new Set(q);\n  for(let i=0;i<q.length;i++){const r=Math.floor(q[i]/N),c=q[i]%N,x=grid[r][c];\n    if(x&&x.sp&&!x.used){x.used=true;for(const [a,b] of effectCells(r,c,x.sp,x.forceT??-1)){const k=K(a,b);if(!seen.has(k)){seen.add(k);q.push(k)}}}}\n  for(const k of q){const r=Math.floor(k/N),c=k%N,x=grid[r][c];if(!x)continue;\n    if(x.crate){x.hp--;const el=els.get(x.id);if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}\n      if(x.hp<=0){grid[r][c]=null;count('crate');if(grass[r][c]){grass[r][c]=false;count('grass')}}continue}\n    grid[r][c]=null;count('c'+x.t);if(grass[r][c]){grass[r][c]=false;count('grass')}}\n  for(const s of create||[])if(!grid[s.r][s.c])grid[s.r][s.c]=tile(s.t,s.sp);\n  render();hud();await sleep(220)}\nasync function gravity(){const spawn=new Map();\n  for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--)if(grid[r][c]){const x=grid[r][c];grid[r][c]=null;grid[w][c]=x;w--}\n    const n=w+1;for(let r=w;r>=0;r--){const x=tile(rnd(L.types));grid[r][c]=x;spawn.set(x.id,r-n)}}\n  render(spawn);await sleep(230)}\nasync function cascade(swapCells){for(let guard=0;guard<50;guard++){const groups=findGroups();if(!groups.length)break;\n  const cells=[],create=[],adj=new Set();\n  for(const g of groups){const ks=[...g.keys];ks.forEach(k=>cells.push([Math.floor(k/N),k%N]));\n    if(g.sp){let pk=ks[Math.floor(ks.length/2)];if(swapCells)for(const [r,c] of swapCells)if(g.keys.has(K(r,c)))pk=K(r,c);\n      const r=Math.floor(pk/N),c=pk%N;create.push({r,c,t:grid[r][c].t,sp:g.sp})}\n    for(const k of ks){const r=Math.floor(k/N),c=k%N;for(const [a,b] of [[r-1,c],[r+1,c],[r,c-1],[r,c+1]])if(a>=0&&b>=0&&a<N&&b<N&&grid[a][b]&&grid[a][b].crate)adj.add(K(a,b))}}\n  adj.forEach(k=>cells.push([Math.floor(k/N),k%N]));\n  await blast(cells,create);await gravity();swapCells=null}}\n// ===== swapping =====\nasync function trySwap(a,b){if(busy||over)return false;const A=grid[a.r][a.c],B=grid[b.r][b.c];if(!isGem(A)||!isGem(B))return false;\n  busy=true;sel=null;grid[a.r][a.c]=B;grid[b.r][b.c]=A;render();await sleep(190);\n  if(A.sp||B.sp){moves--;hud();\n    let cells=[];const P=b; // A now sits at b\n    if(A.sp&&B.sp){A.used=B.used=true;const sps=[A.sp,B.sp];\n      if(sps.every(s=>s==='rainbow')){for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push([r,c])}\n      else if(sps.includes('rainbow')){const X=A.sp==='rainbow'?B:A,col=X.t;cells.push([a.r,a.c],[b.r,b.c]);\n        for(let r=0;r<N;r++)for(let c=0;c<N;c++){const y=grid[r][c];if(matchable(y)&&y.t===col&&y!==X){y.sp=X.sp==='bomb'?'bomb':(rnd(2)?'rh':'rv');y.used=false;cells.push([r,c])}}\n        render();await sleep(250)}\n      else if(sps.every(s=>s==='bomb')){for(let r=P.r-2;r<=P.r+2;r++)for(let c=P.c-2;c<=P.c+2;c++)cells.push([r,c])}\n      else if(sps.includes('bomb')){for(let x=0;x<N;x++)for(let d=-1;d<=1;d++){cells.push([P.r+d,x],[x,P.c+d])}}\n      else{for(let x=0;x<N;x++)cells.push([P.r,x],[x,P.c])}\n      cells=cells.filter(([r,c])=>r>=0&&c>=0&&r<N&&c<N)}\n    else{const S=A.sp?A:B,O=A.sp?B:A,sPos=A.sp?b:a;\n      if(S.sp==='rainbow'){S.forceT=O.t;}cells.push([sPos.r,sPos.c])}\n    await blast(cells);await gravity();await cascade(null)}\n  else{if(!findGroups().length){grid[a.r][a.c]=A;grid[b.r][b.c]=B;render();await sleep(190);busy=false;return false}\n    moves--;hud();await cascade([[a.r,a.c],[b.r,b.c]])}\n  if(!checkEnd()&&!hasMove()){shuffleBoard();await sleep(250)}\n  busy=false;return true}\nfunction stars(){const f=moves/L.moves;return f>=.3?3:f>=.12?2:1}\nfunction checkEnd(){const won=Object.values(goal).every(g=>g.got>=g.need);\n  if(won||moves<=0){over=true;const s=won?stars():0;\n    if(won){mem.stars[lv]=Math.max(mem.stars[lv]||0,s);mem.unlocked=Math.max(mem.unlocked,Math.min(LEVELS.length,lv+2));saveProg()}\n    setTimeout(()=>{$('ovTitle').textContent=won?'🎉 過關！':'😢 失敗了';\n      $('ovStars').innerHTML=won?'★'.repeat(s)+'<i>'+'★'.repeat(3-s)+'<\/i>':'';$('ovStars').style.display=won?'':'none';\n      $('ovText').textContent=won?`剩餘 ${moves} 步`:'步數用完了，再試一次吧！';\n      $('ovNext').classList.toggle('hide',!won||lv>=LEVELS.length-1);$('ov').classList.add('show')},450);return true}\n  return false}\n// ===== input =====\nfunction cellAt(e){const b=$('inner').getBoundingClientRect();const c=Math.floor((e.clientX-b.left)/b.width*N),r=Math.floor((e.clientY-b.top)/b.height*N);return r>=0&&c>=0&&r<N&&c<N?{r,c}:null}\nlet start=null,startXY=null,swiped=false;\n$('board').addEventListener('pointerdown',e=>{if(busy||over)return;e.preventDefault();start=cellAt(e);startXY=[e.clientX,e.clientY];swiped=false;try{$('board').setPointerCapture(e.pointerId)}catch(_){}});\n$('board').addEventListener('pointermove',e=>{if(!start||swiped)return;const dx=e.clientX-startXY[0],dy=e.clientY-startXY[1],th=$('inner').getBoundingClientRect().width/N*.35;\n  if(Math.max(Math.abs(dx),Math.abs(dy))<th)return;swiped=true;const t=Math.abs(dx)>Math.abs(dy)?{r:start.r,c:start.c+Math.sign(dx)}:{r:start.r+Math.sign(dy),c:start.c};\n  if(t.r>=0&&t.c>=0&&t.r<N&&t.c<N)trySwap(start,t);start=null});\n$('board').addEventListener('pointerup',()=>{if(!start||swiped){start=null;return}const p=start;start=null;\n  if(sel&&Math.abs(sel.r-p.r)+Math.abs(sel.c-p.c)===1){const s=sel;sel=null;trySwap(s,p)}else{sel=sel&&sel.r===p.r&&sel.c===p.c?null:p;render()}});\n// ===== map & buttons =====\nfunction drawMap(){$('map').innerHTML=LEVELS.map((_,i)=>{const lock=i>=mem.unlocked,s=mem.stars[i]||0;\n  return`<button class=\"lv${lock?' locked':''}${i===mem.unlocked-1?' cur':''}\" data-i=\"${i}\">${lock?'🔒':i+1}<span class=\"st\">${lock?'':'<b>'+'★'.repeat(s)+'<\/b>'+'☆'.repeat(3-s)}<\/span><\/button>`}).join('')}\n$('map').onclick=e=>{const b=e.target.closest('.lv');if(!b||b.classList.contains('locked'))return;startLevel(+b.dataset.i)};\nfunction toMap(){$('ov').classList.remove('show');$('gameView').classList.add('hide');$('mapView').classList.remove('hide');drawMap()}\n$('toMap').onclick=toMap;$('restart').onclick=()=>{if(!busy)startLevel(lv)};$('ovRetry').onclick=()=>startLevel(lv);$('ovNext').onclick=()=>startLevel(lv+1);\nloadProg();drawMap();try{if(parent!==window)parent.postMessage({m3load:1},parent.location.origin)}catch(e){}\n<\/script><\/body><\/html>\n", "bbq": "<!DOCTYPE html>\n<html lang=\"zh-Hant-TW\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\">\n<title>燒肉屋｜炭火小老闆<\/title>\n<style>\n  :root{--font:\"PingFang TC\",\"Microsoft JhengHei\",\"Noto Sans TC\",\"Noto Sans CJK TC\",\"Noto Serif CJK TC\",\"Heiti TC\",sans-serif;}\n  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 40%,#3a1d10,#120805 75%);overflow:hidden;\n    font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}\n  #wrap{position:absolute;left:50%;top:50%;width:960px;height:640px;transform-origin:center center;transform:translate(-50%,-50%);}\n  canvas{display:block;width:960px;height:640px;touch-action:none;border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 3px #5a2a14;}\n  #topBtns{position:absolute;right:12px;top:6px;display:flex;gap:6px;z-index:5}\n  #topBtns button{font-family:var(--font);font-size:14px;font-weight:700;color:#fff3dc;background:rgba(120,40,15,.85);border:2px solid #e9a25b;\n    border-radius:10px;padding:4px 10px;cursor:pointer;transition:transform .12s,background .2s}\n  #topBtns button:hover{transform:translateY(-1px);background:rgba(160,55,20,.95)}\n  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(25,10,4,.68);\n    border-radius:16px;z-index:10;transition:opacity .3s ease;opacity:1}\n  .overlay.hidden{opacity:0;pointer-events:none}\n  .card{background:linear-gradient(180deg,#fffaf0,#f4e2c2);color:#4a2412;border-radius:20px;padding:22px 34px 24px;width:600px;\n    box-shadow:0 22px 60px rgba(0,0,0,.55),inset 0 0 0 2px #fff;border:5px solid #8b2f12;text-align:center;position:relative}\n  .overlay:not(.hidden) .card{animation:pop .42s cubic-bezier(.2,1.4,.4,1)}\n  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}\n  h1{margin:0;font-size:58px;letter-spacing:10px;color:#b3260e;text-shadow:3px 3px 0 #ffd27a,6px 6px 0 rgba(0,0,0,.18)}\n  .sub{margin:2px 0 12px;font-size:17px;color:#8a4a22;letter-spacing:2px}\n  h2{margin:0 0 10px;font-size:34px;color:#b3260e}\n  ol{text-align:left;margin:8px 0 14px;padding-left:26px;font-size:15.5px;line-height:1.7}\n  ol b{color:#b3260e}\n  .btn{font-family:var(--font);font-size:22px;font-weight:800;letter-spacing:3px;color:#fff;border:none;border-radius:14px;padding:11px 34px;margin:4px 6px;\n    background:linear-gradient(180deg,#ff7a3d,#d9381a);box-shadow:0 5px 0 #8b2310,0 8px 18px rgba(0,0,0,.25);cursor:pointer;transition:transform .1s,box-shadow .1s}\n  .btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #8b2310,0 10px 20px rgba(0,0,0,.25)}\n  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8b2310}\n  .btn.alt{background:linear-gradient(180deg,#a7835e,#7a5634);box-shadow:0 5px 0 #4a3018}\n  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;font-size:17px;margin:8px 10px 14px;background:rgba(255,255,255,.55);\n    border-radius:12px;padding:12px 18px}\n  .stats span{float:right;font-weight:800;color:#b3260e}\n  .big{font-size:22px;font-weight:800;margin:6px 0}\n  .ok{color:#2f8a2f}.bad{color:#c0261a}\n  .hint{font-size:13px;color:#8a5a3a;margin-top:8px}\n  .keys{font-size:13px;color:#8a5a3a}\n<\/style>\n<\/head>\n<body>\n<div id=\"wrap\">\n  <canvas id=\"game\" width=\"960\" height=\"640\"><\/canvas>\n  <div id=\"topBtns\"><button id=\"btnPause\" title=\"暫停 (P)\">暫停<\/button><button id=\"btnMute\" title=\"音效開關 (M)\">音效：開<\/button><\/div>\n\n  <div id=\"startOv\" class=\"overlay\">\n    <div class=\"card\">\n      <h1>燒肉屋<\/h1>\n      <div class=\"sub\">～ 炭火燒肉・小老闆挑戰 ～<\/div>\n      <ol>\n        <li><b>點<\/b>左邊的肉盤，肉就會放上烤網（也可以直接拖到想要的格子）。<\/li>\n        <li><b>點<\/b>烤網上的肉可以<b>翻面<\/b>——兩面都要烤熟才能上桌！<\/li>\n        <li>肉周圍的圓環是<b>底面熟度<\/b>：進入<b>金色區<\/b>＝完美，變紅就要焦了。<\/li>\n        <li>烤好後<b>按住拖<\/b>給點這道菜的客人；途中<b>拖過醬汁碟<\/b>可以沾醬，多賺小費。<\/li>\n        <li>焦掉的肉客人不收，請拖到<b>垃圾桶<\/b>。客人等太久會生氣離開！<\/li>\n        <li>每天營業 <b>120 秒<\/b>，達到營業目標才能開下一天，越後面越忙喔。<\/li>\n      <\/ol>\n      <button class=\"btn\" id=\"btnStart\">開始營業<\/button>\n      <div class=\"hint\" id=\"bestLine\"><\/div>\n      <div class=\"keys\">快捷鍵：P 暫停　M 靜音｜支援滑鼠與觸控<\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"sumOv\" class=\"overlay hidden\">\n    <div class=\"card\">\n      <h2 id=\"sumTitle\">打烊囉！<\/h2>\n      <div class=\"big\" id=\"sumResult\"><\/div>\n      <div class=\"stats\" id=\"sumStats\"><\/div>\n      <div id=\"sumBtns\"><\/div>\n      <div class=\"hint\" id=\"sumHint\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"pauseOv\" class=\"overlay hidden\">\n    <div class=\"card\" style=\"width:360px\">\n      <h2>暫停中<\/h2>\n      <p style=\"margin:4px 0 16px\">炭火幫你顧著，肉不會烤焦。<\/p>\n      <button class=\"btn\" id=\"btnResume\">繼續營業<\/button><br>\n      <button class=\"btn alt\" id=\"btnQuit\" style=\"font-size:17px;margin-top:10px\">回主畫面<\/button>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n(() => {\n'use strict';\nconst W = 960, H = 640, TAU = Math.PI * 2;\nconst cv = document.getElementById('game');\nconst ctx = cv.getContext('2d');\nconst wrap = document.getElementById('wrap');\nconst $ = id => document.getElementById(id);\nconst FONT = '\"PingFang TC\",\"Microsoft JhengHei\",\"Noto Sans TC\",\"Noto Sans CJK TC\",\"Noto Serif CJK TC\",sans-serif';\n\n/* ---------- scaling ---------- */\nlet pxr = 1, timeScale = 1;\nfunction resize() {\n  const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;\n  wrap.style.transform = `translate(-50%,-50%) scale(${s})`;\n  pxr = Math.max(1, (window.devicePixelRatio || 1) * s);\n  cv.width = Math.round(W * pxr); cv.height = Math.round(H * pxr);\n}\nwindow.addEventListener('resize', resize); resize();\n\n/* ---------- data ---------- */\nconst PERFECT_LO = 1.15, PERFECT_HI = 1.55, BURN = 1.9;\nconst MEATS = {\n  karubi:   { name: '牛五花', cook: 4.5, price: 30, unlock: 1,\n              c: [[205, 52, 70], [140, 72, 40], [36, 22, 16]], f: [[248, 222, 222], [238, 196, 138], [52, 36, 26]] },\n  chicken:  { name: '雞腿肉', cook: 6.5, price: 25, unlock: 1,\n              c: [[244, 178, 166], [214, 150, 66], [44, 28, 16]] },\n  tongue:   { name: '牛舌',   cook: 3.2, price: 40, unlock: 2,\n              c: [[226, 116, 134], [170, 112, 84], [40, 26, 20]] },\n  shiitake: { name: '香菇',   cook: 3.8, price: 15, unlock: 3,\n              c: [[206, 168, 126], [118, 74, 40], [32, 20, 14]] },\n  shrimp:   { name: '大蝦',   cook: 5.0, price: 35, unlock: 4,\n              c: [[150, 166, 184], [255, 118, 64], [50, 26, 18]] },\n};\nconst MEAT_ORDER = ['karubi', 'chicken', 'tongue', 'shiitake', 'shrimp'];\n\n// layout\nconst GRILL = { x: 236, y: 244, w: 488, h: 372 };\nconst COLS = 4, ROWS = 3;\nconst SLOTS = [];\nfor (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)\n  SLOTS.push({ x: GRILL.x + 64 + c * 120, y: GRILL.y + 66 + r * 120 });\nconst TRAY = { x: 14, y: 236, w: 206, h: 392 };\nconst PLATES = MEAT_ORDER.map((t, i) => ({ type: t, x: TRAY.x + 8, y: TRAY.y + 34 + i * 70, w: TRAY.w - 16, h: 64 }));\nconst SAUCE = { x: 842, y: 330, r: 64 };\nconst TRASH = { x: 842, y: 528, w: 120, h: 120 };\nconst SEATS = [100, 305, 510, 715];\nconst COUNTER_Y = 198;\n\n/* ---------- state ---------- */\nlet state = 'menu';         // menu | playing | paused | summary\nlet day = 1, timeLeft = 120, dayMoney = 0, totalMoney = 0, gameTime = 0;\nlet pieces = [], customers = [], particles = [], floats = [], coins = [];\nlet spawnTimer = 1, pieceId = 0, lastTick = 0, moneyBump = 0, banner = null;\nlet stats = {};\nlet pointer = { x: -100, y: -100, down: false };\nlet press = null, drag = null;\nlet best = 0;\ntry { best = +localStorage.getItem('yakiniku_best_v1') || 0; } catch (e) {}\n\nconst rand = (a, b) => a + Math.random() * (b - a);\nconst randi = (a, b) => Math.floor(rand(a, b + 1));\nconst clamp = (v, a, b) => Math.max(a, Math.min(b, v));\nconst lerp = (a, b, t) => a + (b - a) * t;\nconst easeOut = t => 1 - Math.pow(1 - t, 3);\nconst easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };\n\nfunction unlocked() { return MEAT_ORDER.filter(t => MEATS[t].unlock <= day); }\nfunction dayTarget(d) { return 220 + (d - 1) * 200; }\nfunction speedMult() { return 1 + 0.07 * (day - 1); }\n\n/* ---------- audio ---------- */\nlet AC = null, master = null, sizzleGain = null, noiseBuf = null, muted = false;\nfunction initAudio() {\n  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }\n  try {\n    AC = new (window.AudioContext || window.webkitAudioContext)();\n    master = AC.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(AC.destination);\n    const len = AC.sampleRate * 2;\n    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);\n    const d = noiseBuf.getChannelData(0);\n    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.015 ? 1 : 0.3);\n    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;\n    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;\n    const pk = AC.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 5000; pk.gain.value = 6;\n    sizzleGain = AC.createGain(); sizzleGain.gain.value = 0;\n    src.connect(hp); hp.connect(pk); pk.connect(sizzleGain); sizzleGain.connect(master); src.start();\n  } catch (e) { AC = null; }\n}\nfunction tone(f1, f2, dur, type = 'sine', vol = 0.2, delay = 0) {\n  if (!AC || muted) return;\n  const t = AC.currentTime + delay;\n  const o = AC.createOscillator(), g = AC.createGain();\n  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);\n  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);\n}\nfunction noise(dur, freq = 3000, vol = 0.3, type = 'highpass') {\n  if (!AC || muted) return;\n  const t = AC.currentTime;\n  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = rand(0.8, 1.2);\n  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;\n  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\n  s.connect(f); f.connect(g); g.connect(master); s.start(t, rand(0, 1.5)); s.stop(t + dur + 0.05);\n}\nconst sfx = {\n  place() { noise(0.6, 2500, 0.35); tone(180, 90, 0.08, 'sine', 0.15); },\n  flip() { tone(420, 880, 0.09, 'triangle', 0.16); noise(0.35, 3000, 0.22); },\n  pick() { tone(700, 500, 0.06, 'square', 0.06); },\n  sauce() { noise(0.18, 600, 0.25, 'lowpass'); tone(300, 160, 0.12, 'sine', 0.12); },\n  coin() { tone(1320, 1320, 0.09, 'square', 0.07); tone(1760, 1760, 0.18, 'square', 0.07, 0.08); },\n  happy() { [660, 830, 990].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.12, i * 0.07)); },\n  bad() { tone(220, 120, 0.25, 'sawtooth', 0.09); },\n  angry() { tone(180, 90, 0.4, 'sawtooth', 0.1); tone(170, 85, 0.4, 'square', 0.05, 0.05); },\n  trash() { noise(0.25, 400, 0.35, 'lowpass'); tone(140, 70, 0.15, 'sine', 0.15); },\n  burn() { noise(0.5, 1200, 0.18, 'bandpass'); },\n  tick() { tone(1000, 1000, 0.05, 'square', 0.05); },\n  bell() { [880, 1175].forEach((f, i) => tone(f, f * 0.98, 0.6, 'sine', 0.15, i * 0.18)); },\n};\nfunction setMuted(m) {\n  muted = m; $('btnMute').textContent = muted ? '音效：關' : '音效：開';\n  if (master) master.gain.value = muted ? 0 : 0.55;\n}\n\n/* ---------- color helpers ---------- */\nfunction mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }\nfunction rgb(c, a = 1) { return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; }\nfunction shade(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }\nfunction doneColor(tri, v) {\n  const [raw, ck, bt] = tri;\n  if (v < 1) { const t = v * v * (3 - 2 * v); return mix(raw, ck, t); }\n  if (v < PERFECT_HI) return mix(ck, shade(ck, 0.92), (v - 1) / (PERFECT_HI - 1));\n  if (v < BURN) return mix(shade(ck, 0.92), bt, (v - PERFECT_HI) / (BURN - PERFECT_HI) * 0.4);\n  return mix(mix(shade(ck, 0.92), bt, 0.4), bt, clamp((v - BURN) / 0.45, 0, 1));\n}\nfunction sideState(v) {\n  if (v < 1) return 'raw';\n  if (v >= BURN) return 'burnt';\n  if (v >= PERFECT_LO && v <= PERFECT_HI) return 'perfect';\n  return 'ok';\n}\nfunction pieceQuality(p) {\n  const a = sideState(p.sides[0]), b = sideState(p.sides[1]);\n  if (a === 'burnt' || b === 'burnt') return 'burnt';\n  if (a === 'raw' || b === 'raw') return 'raw';\n  if (a === 'perfect' && b === 'perfect') return 'perfect';\n  return 'ok';\n}\n\n/* ---------- drawing primitives ---------- */\nfunction rr(x, y, w, h, r) {\n  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);\n  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();\n}\nfunction text(str, x, y, size, color, align = 'center', weight = 800, stroke = null, sw = 4) {\n  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';\n  if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }\n  ctx.fillStyle = color; ctx.fillText(str, x, y);\n}\n\nfunction meatPath(type, s) {\n  ctx.beginPath();\n  if (type === 'karubi') { rr(-40 * s, -24 * s, 80 * s, 48 * s, 14 * s); }\n  else if (type === 'tongue') { ctx.ellipse(0, 0, 33 * s, 28 * s, 0, 0, TAU); }\n  else if (type === 'chicken') {\n    ctx.moveTo(-36 * s, -6 * s);\n    ctx.bezierCurveTo(-34 * s, -30 * s, 10 * s, -30 * s, 30 * s, -18 * s);\n    ctx.bezierCurveTo(46 * s, -8 * s, 40 * s, 20 * s, 20 * s, 24 * s);\n    ctx.bezierCurveTo(0, 30 * s, -30 * s, 28 * s, -38 * s, 12 * s);\n    ctx.closePath();\n  } else if (type === 'shiitake') { ctx.arc(0, 0, 30 * s, 0, TAU); }\n}\n// v = doneness of the visible side, marks = doneness of visible side used for grill marks\nfunction drawMeat(type, v, s, sauced = false, seed = 1) {\n  const m = MEATS[type];\n  const col = doneColor(m.c, v);\n  const burnt = clamp((v - BURN) / 0.45, 0, 1);\n  ctx.save();\n  if (type === 'shrimp') {\n    ctx.lineCap = 'round';\n    ctx.strokeStyle = rgb(shade(col, 0.7)); ctx.lineWidth = 22 * s;\n    ctx.beginPath(); ctx.arc(0, 6 * s, 24 * s, Math.PI * 1.05, Math.PI * 2.05); ctx.stroke();\n    ctx.strokeStyle = rgb(col); ctx.lineWidth = 18 * s;\n    ctx.beginPath(); ctx.arc(0, 6 * s, 24 * s, Math.PI * 1.05, Math.PI * 2.05); ctx.stroke();\n    // segments\n    ctx.strokeStyle = rgb(shade(col, 0.75), 0.8); ctx.lineWidth = 2 * s;\n    for (let i = 1; i < 6; i++) {\n      const a = Math.PI * (1.05 + i * 0.17);\n      ctx.beginPath(); ctx.moveTo(Math.cos(a) * 15 * s, 6 * s + Math.sin(a) * 15 * s);\n      ctx.lineTo(Math.cos(a) * 33 * s, 6 * s + Math.sin(a) * 33 * s); ctx.stroke();\n    }\n    // tail\n    const tc = rgb(v >= 1 ? mix(col, [230, 60, 30], 0.3) : shade(col, 0.85));\n    ctx.fillStyle = tc; ctx.beginPath();\n    ctx.moveTo(24 * s, 8 * s); ctx.lineTo(38 * s, 20 * s); ctx.lineTo(26 * s, 24 * s); ctx.lineTo(18 * s, 20 * s); ctx.closePath(); ctx.fill();\n    // highlight\n    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 4 * s;\n    ctx.beginPath(); ctx.arc(0, 6 * s, 28 * s, Math.PI * 1.25, Math.PI * 1.7); ctx.stroke();\n    if (sauced) { ctx.strokeStyle = 'rgba(90,40,10,.45)'; ctx.lineWidth = 18 * s;\n      ctx.beginPath(); ctx.arc(0, 6 * s, 24 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }\n    if (burnt > 0) { ctx.strokeStyle = `rgba(15,8,5,${burnt * 0.6})`; ctx.lineWidth = 22 * s;\n      ctx.beginPath(); ctx.arc(0, 6 * s, 24 * s, Math.PI * 1.05, Math.PI * 2.05); ctx.stroke(); }\n    ctx.restore(); return;\n  }\n  // shadow edge\n  ctx.save(); ctx.translate(0, 2 * s); meatPath(type, s); ctx.fillStyle = rgb(shade(col, 0.55)); ctx.fill(); ctx.restore();\n  meatPath(type, s); ctx.fillStyle = rgb(col); ctx.fill();\n  ctx.save(); meatPath(type, s); ctx.clip();\n  // texture\n  if (type === 'karubi') {\n    ctx.strokeStyle = rgb(doneColor(m.f, v), 0.95); ctx.lineWidth = 4.5 * s; ctx.lineCap = 'round';\n    for (let i = -1; i <= 1; i++) {\n      ctx.beginPath();\n      for (let x = -44; x <= 44; x += 4) {\n        const y = i * 14 + Math.sin(x * 0.12 + i * 2 + seed) * 3.5;\n        x === -44 ? ctx.moveTo(x * s, y * s) : ctx.lineTo(x * s, y * s);\n      }\n      ctx.stroke();\n    }\n  } else if (type === 'tongue') {\n    ctx.fillStyle = rgb(mix(col, [255, 255, 255], 0.18), 0.7);\n    for (let i = 0; i < 14; i++)     if(typeof d.lobbyLoad==='string'&&SAVE_KEYS[d.lobbyLoad]){const v=JSON.parse(localStorage.getItem('lobby_'+d.lobbyLoad)||'null');if(v)e.source.postMessage({lobbyData:{key:d.lobbyLoad,val:v}},location.origin)}
    if(d.m3save){localStorage.setItem('lobby_m3',JSON.stringify(d.m3save));relayScore({game:'match3',score:matchCleared(d.m3save)})}
    if(d.m3load){const v=JSON.parse(localStorage.getItem('lobby_m3')||'null');if(v)e.source.postMessage({m3data:v},location.origin)}
    if(typeof d.officeSolve==='string'&&GAMES[d.officeSolve])relayScore({game:d.officeSolve,op:'solve'})
  }catch(_){}
});
addEventListener('storage',e=>{if(e.key==='yakiniku_best_v1')reportBbq()});
addEventListener('hashchange',()=>{if(GAMES[location.hash.slice(1)])nav++;else nav=0;route()});route();
